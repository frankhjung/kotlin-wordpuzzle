---

image: gradle:8.10-jdk21

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_CLI_OPTS: "--build-cache --console=plain"
  # GRADLE_CLI_OPTS: " --build-cache --console=plain --debug"

before_script:
  - export GRADLE_USER_HOME=${CI_PROJECT_DIR}/.gradle

build:
  stage: build
  script: ./gradlew ${GRADLE_CLI_OPTS} clean build
  artifacts:
    paths:
      - build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

pages:
  stage: deploy
  image: alpine
  only:
    refs:
      - master
  except:
    - tags
  script:
    - mv build/reports/tests/test/ public
  artifacts:
    paths:
      - public
      - build/distributions/
