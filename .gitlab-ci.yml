---

image: gradle:7.0.0

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - export GRADLE_USER_HOME=${CI_PROJECT_DIR}/.gradle

build:
  stage: build
  script: gradle ${GRADLE_CLI_OPTS} --build-cache --console=plain --continue --debug clean build
  artifacts:
    paths:
      - build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
